<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shedRoof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="interiorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#0F172A"/>

  <!-- Steel Industrial Portal Frame / Gantry Truss Roof -->
  <polygon points="50,140 400,60 750,140 750,170 400,90 50,170" fill="url(#shedRoof)"/>
  
  <!-- Steel Support Columns -->
  <rect x="80" y="170" width="20" height="230" fill="#64748B"/>
  <rect x="700" y="170" width="20" height="230" fill="#64748B"/>
  <rect x="390" y="90" width="20" height="310" fill="#475569" stroke="#334155" stroke-width="2"/>

  <!-- Concrete Paved Workshop Floor -->
  <rect x="50" y="400" width="700" height="60" fill="#334155"/>

  <!-- Protected Interior Crating Area: Timber Crates and Pallets -->
  <rect x="140" y="280" width="160" height="120" rx="3" fill="#D97706" stroke="#B45309" stroke-width="2"/>
  <line x1="140" y1="280" x2="300" y2="400" stroke="#92400E" stroke-width="2"/>
  <line x1="140" y1="400" x2="300" y2="280" stroke="#92400E" stroke-width="2"/>

  <!-- Wrapped Palletized Export Consignments (Barrier Foil / Shrink Wrapped) -->
  <rect x="330" y="240" width="140" height="160" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <line x1="330" y1="290" x2="470" y2="290" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="330" y1="340" x2="470" y2="340" stroke="#64748B" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Mobile Forklift Silhouette -->
  <rect x="510" y="320" width="120" height="70" rx="6" fill="#F59E0B"/>
  <rect x="630" y="270" width="10" height="130" fill="#0F172A"/>
  <rect x="640" y="380" width="40" height="8" rx="2" fill="#0F172A"/>
  <circle cx="540" cy="400" r="16" fill="#0F172A"/>
  <circle cx="610" cy="400" r="16" fill="#0F172A"/>

  <!-- Header Info -->
  <rect x="25" y="25" width="310" height="48" rx="6" fill="#0F172A" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F87171">SHADED WAREHOUSE</text>
  <text x="40" y="62" font-family="monospace" font-size="10" fill="#94A3B8">Covered Weatherproof Packing Shed & Crating Bay</text>
</svg>
