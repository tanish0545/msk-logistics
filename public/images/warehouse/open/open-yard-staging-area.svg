<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="yardSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <linearGradient id="tarmac" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="260" fill="url(#yardSky)"/>
  <rect y="260" width="800" height="240" fill="url(#tarmac)"/>

  <!-- High Mast Floodlight Tower -->
  <line x1="120" y1="260" x2="120" y2="60" stroke="#94A3B8" stroke-width="4"/>
  <polygon points="100,60 140,60 120,40" fill="#CBD5E1"/>
  <circle cx="110" cy="55" r="4" fill="#FEF08A"/>
  <circle cx="130" cy="55" r="4" fill="#FEF08A"/>

  <!-- Heavy Duty Open Yard Staging Grid Lines -->
  <line x1="0" y1="360" x2="800" y2="360" stroke="#E2E8F0" stroke-width="3" stroke-dasharray="20,15"/>
  <line x1="0" y1="440" x2="800" y2="440" stroke="#F59E0B" stroke-width="2"/>

  <!-- Staged Container Stacks in Open Yard -->
  <!-- 20ft Blue Stack -->
  <rect x="220" y="210" width="180" height="90" rx="3" fill="#1D4ED8" stroke="#1E40AF" stroke-width="2"/>
  <rect x="220" y="120" width="180" height="90" rx="3" fill="#2563EB" stroke="#1E40AF" stroke-width="2"/>
  <!-- 40ft Red Container Stack -->
  <rect x="440" y="210" width="280" height="90" rx="3" fill="#B91C1C" stroke="#991B1B" stroke-width="2"/>
  <rect x="440" y="120" width="280" height="90" rx="3" fill="#DC2626" stroke="#991B1B" stroke-width="2"/>

  <!-- Industrial Wooden Crates Positioned on Ground -->
  <rect x="160" y="380" width="90" height="60" rx="2" fill="#D97706" stroke="#78350F" stroke-width="2"/>
  <line x1="160" y1="380" x2="250" y2="440" stroke="#92400E" stroke-width="2"/>
  <line x1="160" y1="440" x2="250" y2="380" stroke="#92400E" stroke-width="2"/>

  <rect x="270" y="370" width="120" height="70" rx="2" fill="#B45309" stroke="#78350F" stroke-width="2"/>
  <line x1="270" y1="370" x2="390" y2="440" stroke="#78350F" stroke-width="2"/>

  <!-- Header Info -->
  <rect x="25" y="25" width="310" height="48" rx="6" fill="#0F172A" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F87171">OPEN WAREHOUSE & YARD</text>
  <text x="40" y="62" font-family="monospace" font-size="10" fill="#94A3B8">Reinforced Paved Ground • Container Staging Buffer</text>
</svg>
