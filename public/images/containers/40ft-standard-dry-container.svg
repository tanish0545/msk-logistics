<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="c40Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#0F172A"/>

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- 40ft Container Body (Elongated) -->
  <rect x="100" y="160" width="600" height="170" rx="4" fill="url(#c40Grad)" stroke="#14B8A6" stroke-width="3"/>

  <!-- Corrugation Lines -->
  <g stroke="#0D9488" stroke-width="2.5">
    <line x1="140" y1="160" x2="140" y2="330"/>
    <line x1="180" y1="160" x2="180" y2="330"/>
    <line x1="220" y1="160" x2="220" y2="330"/>
    <line x1="260" y1="160" x2="260" y2="330"/>
    <line x1="300" y1="160" x2="300" y2="330"/>
    <line x1="340" y1="160" x2="340" y2="330"/>
    <line x1="380" y1="160" x2="380" y2="330"/>
    <line x1="420" y1="160" x2="420" y2="330"/>
    <line x1="460" y1="160" x2="460" y2="330"/>
    <line x1="500" y1="160" x2="500" y2="330"/>
    <line x1="540" y1="160" x2="540" y2="330"/>
    <line x1="580" y1="160" x2="580" y2="330"/>
    <line x1="620" y1="160" x2="620" y2="330"/>
    <line x1="660" y1="160" x2="660" y2="330"/>
  </g>

  <!-- Corner Castings -->
  <rect x="92" y="152" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="692" y="152" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="92" y="322" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="692" y="322" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>

  <!-- External Length Dimension Line -->
  <line x1="100" y1="370" x2="700" y2="370" stroke="#FBBF24" stroke-width="2"/>
  <line x1="100" y1="360" x2="100" y2="380" stroke="#FBBF24" stroke-width="2"/>
  <line x1="700" y1="360" x2="700" y2="380" stroke="#FBBF24" stroke-width="2"/>
  <text x="320" y="392" font-family="monospace" font-size="12" font-weight="bold" fill="#FBBF24">EXT LENGTH: 12.19 m (40 ft / 12,192 mm)</text>
  <text x="320" y="408" font-family="monospace" font-size="10" fill="#94A3B8">INT LENGTH: 12.03 m (39.5 ft / 12,032 mm)</text>

  <!-- Title Badge -->
  <rect x="30" y="25" width="340" height="44" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#2DD4BF">40' STANDARD DRY CONTAINER (GP)</text>
  <text x="45" y="58" font-family="monospace" font-size="10" fill="#94A3B8">ISO 1496/1 • Payload ~26,700 kg • Vol ~67.7 m³</text>
</svg>
