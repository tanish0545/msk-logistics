<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="frChassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#0F172A"/>

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Heavy Floor Bed Chassis -->
  <rect x="100" y="270" width="600" height="50" rx="4" fill="url(#frChassis)" stroke="#EF4444" stroke-width="3"/>
  <rect x="100" y="320" width="600" height="15" fill="#7F1D1D"/>

  <!-- Collapsible End Walls -->
  <rect x="90" y="140" width="30" height="140" rx="3" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>
  <rect x="680" y="140" width="30" height="140" rx="3" fill="#B91C1C" stroke="#EF4444" stroke-width="2"/>

  <!-- Corner Post Locking Mechanism -->
  <circle cx="105" cy="160" r="6" fill="#F8FAFC" stroke="#7F1D1D" stroke-width="2"/>
  <circle cx="695" cy="160" r="6" fill="#F8FAFC" stroke="#7F1D1D" stroke-width="2"/>

  <!-- Heavy Side Lashing Rings / D-Rings along Chassis -->
  <circle cx="180" cy="295" r="7" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  <circle cx="260" cy="295" r="7" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  <circle cx="340" cy="295" r="7" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  <circle cx="420" cy="295" r="7" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  <circle cx="500" cy="295" r="7" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>
  <circle cx="580" cy="295" r="7" fill="#FBBF24" stroke="#0F172A" stroke-width="2"/>

  <!-- Dimensions Text -->
  <text x="290" y="380" font-family="monospace" font-size="12" font-weight="bold" fill="#FBBF24">20' & 40' FLAT RACK (FR)</text>
  <text x="290" y="396" font-family="monospace" font-size="10" fill="#94A3B8">Collapsible Walls • Heavy Floor Payload ~40,000 kg • Out-of-Gauge</text>

  <!-- Title Badge -->
  <rect x="30" y="25" width="340" height="44" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F87171">FLAT RACK CONTAINER (FR)</text>
  <text x="45" y="58" font-family="monospace" font-size="10" fill="#94A3B8">Collapsible End Frames • Breakbulk / OOG</text>
</svg>
