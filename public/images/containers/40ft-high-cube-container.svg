<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="hcGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#0F172A"/>

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- 40ft High Cube Container Body (Extra 300mm / 1ft height) -->
  <rect x="100" y="140" width="600" height="195" rx="4" fill="url(#hcGrad)" stroke="#FB923C" stroke-width="3"/>

  <!-- High Cube Warning Decals / Yellow Stripes (Standard Maritime Marker) -->
  <rect x="100" y="140" width="600" height="12" fill="#FACC15"/>
  <g stroke="#0F172A" stroke-width="4">
    <line x1="130" y1="140" x2="140" y2="152"/>
    <line x1="160" y1="140" x2="170" y2="152"/>
    <line x1="190" y1="140" x2="200" y2="152"/>
    <line x1="220" y1="140" x2="230" y2="152"/>
    <line x1="570" y1="140" x2="580" y2="152"/>
    <line x1="600" y1="140" x2="610" y2="152"/>
    <line x1="630" y1="140" x2="640" y2="152"/>
    <line x1="660" y1="140" x2="670" y2="152"/>
  </g>

  <!-- Corrugation Lines -->
  <g stroke="#C2410C" stroke-width="2.5">
    <line x1="150" y1="152" x2="150" y2="335"/>
    <line x1="200" y1="152" x2="200" y2="335"/>
    <line x1="250" y1="152" x2="250" y2="335"/>
    <line x1="300" y1="152" x2="300" y2="335"/>
    <line x1="350" y1="152" x2="350" y2="335"/>
    <line x1="400" y1="152" x2="400" y2="335"/>
    <line x1="450" y1="152" x2="450" y2="335"/>
    <line x1="500" y1="152" x2="500" y2="335"/>
    <line x1="550" y1="152" x2="550" y2="335"/>
    <line x1="600" y1="152" x2="600" y2="335"/>
    <line x1="650" y1="152" x2="650" y2="335"/>
  </g>

  <!-- External Height Dimension Line (2.89m / 9ft 6in) -->
  <line x1="60" y1="140" x2="60" y2="335" stroke="#FBBF24" stroke-width="2"/>
  <line x1="50" y1="140" x2="70" y2="140" stroke="#FBBF24" stroke-width="2"/>
  <line x1="50" y1="335" x2="70" y2="335" stroke="#FBBF24" stroke-width="2"/>
  <text x="45" y="238" font-family="monospace" font-size="11" font-weight="bold" fill="#FBBF24" transform="rotate(-90 45 238)" text-anchor="middle">EXT HEIGHT: 2.89 m (9.5 ft / 2,896 mm)</text>

  <!-- Dimensions Text -->
  <text x="320" y="380" font-family="monospace" font-size="12" font-weight="bold" fill="#FBBF24">EXT LENGTH: 12.19 m (40 ft / 12,192 mm)</text>
  <text x="320" y="396" font-family="monospace" font-size="10" fill="#94A3B8">INT HEIGHT: 2.69 m (8.8 ft / 2,698 mm) • +300 mm Extra Height</text>

  <!-- Title Badge -->
  <rect x="30" y="25" width="340" height="44" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F97316">40' HIGH CUBE CONTAINER (HC)</text>
  <text x="45" y="58" font-family="monospace" font-size="10" fill="#94A3B8">ISO 1496/1 • Payload ~26,500 kg • Vol ~76.3 m³</text>
</svg>
