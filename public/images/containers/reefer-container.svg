<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="reeferGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#0F172A"/>

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Insulated Reefer Body (Clean White Polyurethane Panel) -->
  <rect x="180" y="150" width="520" height="180" rx="4" fill="url(#reeferGrad)" stroke="#38BDF8" stroke-width="3"/>

  <!-- Front Integrated Refrigeration Unit (Compressor & Condenser Grille) -->
  <rect x="100" y="150" width="80" height="180" fill="#334155" stroke="#475569" stroke-width="2"/>
  <g fill="#0284C7">
    <rect x="110" y="170" width="60" height="8" rx="2"/>
    <rect x="110" y="185" width="60" height="8" rx="2"/>
    <rect x="110" y="200" width="60" height="8" rx="2"/>
    <rect x="110" y="215" width="60" height="8" rx="2"/>
    <circle cx="140" cy="260" r="18" fill="#0EA5E9" stroke="#E0F2FE" stroke-width="2"/>
  </g>

  <!-- Stainless Steel Interior T-Bar Floor Line Indicator -->
  <line x1="180" y1="315" x2="700" y2="315" stroke="#0284C7" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Temperature Control Display Callout -->
  <rect x="115" y="295" width="50" height="20" rx="2" fill="#0F172A"/>
  <text x="140" y="309" font-family="monospace" font-size="10" font-weight="bold" fill="#22C55E" text-anchor="middle">-25°C</text>

  <!-- Dimensions Text -->
  <text x="280" y="380" font-family="monospace" font-size="12" font-weight="bold" fill="#38BDF8">20' & 40' REEFER CONTAINER (RF)</text>
  <text x="280" y="396" font-family="monospace" font-size="10" fill="#94A3B8">Thermal Insulation • Genset Power • Controlled Atmosphere</text>

  <!-- Title Badge -->
  <rect x="30" y="25" width="340" height="44" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38BDF8">REFRIGERATED CONTAINER (REEFER)</text>
  <text x="45" y="58" font-family="monospace" font-size="10" fill="#94A3B8">ISO 1496/2 • Temperature Range -30°C to +30°C</text>
</svg>
