<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="c20Grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#0F172A"/>

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- 20ft Container Body -->
  <rect x="220" y="140" width="360" height="200" rx="4" fill="url(#c20Grad)" stroke="#3B82F6" stroke-width="3"/>

  <!-- Corrugation Lines -->
  <g stroke="#1D4ED8" stroke-width="3">
    <line x1="260" y1="140" x2="260" y2="340"/>
    <line x1="300" y1="140" x2="300" y2="340"/>
    <line x1="340" y1="140" x2="340" y2="340"/>
    <line x1="380" y1="140" x2="380" y2="340"/>
    <line x1="420" y1="140" x2="420" y2="340"/>
    <line x1="460" y1="140" x2="460" y2="340"/>
    <line x1="500" y1="140" x2="500" y2="340"/>
    <line x1="540" y1="140" x2="540" y2="340"/>
  </g>

  <!-- Corner Castings (ISO Standard) -->
  <rect x="212" y="132" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="572" y="132" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="212" y="332" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="572" y="332" width="16" height="16" rx="2" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>

  <!-- External Length Dimension Line -->
  <line x1="220" y1="380" x2="580" y2="380" stroke="#FBBF24" stroke-width="2"/>
  <line x1="220" y1="370" x2="220" y2="390" stroke="#FBBF24" stroke-width="2"/>
  <line x1="580" y1="370" x2="580" y2="390" stroke="#FBBF24" stroke-width="2"/>
  <text x="340" y="402" font-family="monospace" font-size="12" font-weight="bold" fill="#FBBF24">EXT LENGTH: 6.06 m (20 ft / 6,058 mm)</text>
  <text x="340" y="418" font-family="monospace" font-size="10" fill="#94A3B8">INT LENGTH: 5.90 m (19.4 ft / 5,898 mm)</text>

  <!-- External Height Dimension Line -->
  <line x1="160" y1="140" x2="160" y2="340" stroke="#FBBF24" stroke-width="2"/>
  <line x1="150" y1="140" x2="170" y2="140" stroke="#FBBF24" stroke-width="2"/>
  <line x1="150" y1="340" x2="170" y2="340" stroke="#FBBF24" stroke-width="2"/>
  <text x="145" y="245" font-family="monospace" font-size="11" font-weight="bold" fill="#FBBF24" transform="rotate(-90 145 245)" text-anchor="middle">EXT HEIGHT: 2.59 m (8.5 ft / 2,591 mm)</text>

  <!-- Title Badge -->
  <rect x="30" y="25" width="340" height="44" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#F87171">20' STANDARD DRY CONTAINER (GP)</text>
  <text x="45" y="58" font-family="monospace" font-size="10" fill="#94A3B8">ISO 1496/1 • Payload ~28,200 kg • Vol ~33.2 m³</text>
</svg>
