<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="otConGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="#0F172A"/>

  <!-- Blueprint Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="480"/>
    <line x1="480" y1="0" x2="480" y2="480"/>
    <line x1="640" y1="0" x2="640" y2="480"/>
  </g>

  <!-- Container Steel Body -->
  <rect x="120" y="180" width="560" height="150" rx="4" fill="url(#otConGrad)" stroke="#10B981" stroke-width="3"/>

  <!-- Tarpaulin Cover with Lashing Cord and Removable Bows -->
  <rect x="120" y="170" width="560" height="16" rx="2" fill="#2563EB" stroke="#1D4ED8" stroke-width="2"/>
  <polyline points="130,186 160,198 190,186 220,198 250,186 280,198 310,186 340,198 370,186 400,198 430,186 460,198 490,186 520,198 550,186 580,198 610,186 640,198 670,186" 
            fill="none" stroke="#FBBF24" stroke-width="2"/>

  <!-- Corrugation Panels -->
  <g stroke="#064E3B" stroke-width="2.5">
    <line x1="180" y1="186" x2="180" y2="330"/>
    <line x1="240" y1="186" x2="240" y2="330"/>
    <line x1="300" y1="186" x2="300" y2="330"/>
    <line x1="360" y1="186" x2="360" y2="330"/>
    <line x1="420" y1="186" x2="420" y2="330"/>
    <line x1="480" y1="186" x2="480" y2="330"/>
    <line x1="540" y1="186" x2="540" y2="330"/>
    <line x1="600" y1="186" x2="600" y2="330"/>
  </g>

  <!-- Door Opening Detail with Removable Header -->
  <rect x="670" y="180" width="10" height="150" fill="#34D399"/>
  <text x="690" y="240" font-family="monospace" font-size="10" fill="#34D399">Swing Header</text>

  <!-- Dimensions Text -->
  <text x="280" y="380" font-family="monospace" font-size="12" font-weight="bold" fill="#FBBF24">20' & 40' OPEN TOP (OT)</text>
  <text x="280" y="396" font-family="monospace" font-size="10" fill="#94A3B8">Top Crane Loading • Removable Roof Bows • TIR Tarpaulin</text>

  <!-- Title Badge -->
  <rect x="30" y="25" width="340" height="44" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="45" y="44" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#34D399">OPEN TOP CONTAINER (OT)</text>
  <text x="45" y="58" font-family="monospace" font-size="10" fill="#94A3B8">Removable Roof Bows • Tarpaulin Lashing</text>
</svg>
