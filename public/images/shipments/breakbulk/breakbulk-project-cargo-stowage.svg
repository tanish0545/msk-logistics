<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="holdSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tankSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="350" fill="url(#holdSky)"/>
  <rect y="350" width="800" height="150" fill="#0B1329"/>

  <!-- Ship Cargo Hold Ribs & Floor -->
  <line x1="100" y1="50" x2="100" y2="350" stroke="#334155" stroke-width="6"/>
  <line x1="700" y1="50" x2="700" y2="350" stroke="#334155" stroke-width="6"/>
  <rect x="80" y="330" width="640" height="25" fill="#334155"/>

  <!-- Large Heavy Duty Storage Vessel / Reactor Column -->
  <rect x="180" y="140" width="440" height="150" rx="30" fill="url(#tankSteel)" stroke="#334155" stroke-width="3"/>
  <circle cx="280" cy="215" r="40" fill="#334155" opacity="0.5"/>
  <circle cx="520" cy="215" r="40" fill="#334155" opacity="0.5"/>

  <!-- Complex Timber Chocking System (Dunnage Grid) -->
  <rect x="140" y="300" width="520" height="30" fill="#B45309" stroke="#78350F" stroke-width="2"/>
  <rect x="220" y="270" width="60" height="30" fill="#D97706"/>
  <rect x="520" y="270" width="60" height="30" fill="#D97706"/>

  <!-- Steel Wire Tension Lashings with Turnbuckles -->
  <line x1="100" y1="330" x2="280" y2="140" stroke="#FBBF24" stroke-width="5"/>
  <line x1="100" y1="200" x2="240" y2="140" stroke="#EF4444" stroke-width="4"/>
  <line x1="700" y1="330" x2="520" y2="140" stroke="#FBBF24" stroke-width="5"/>
  <line x1="700" y1="200" x2="560" y2="140" stroke="#EF4444" stroke-width="4"/>

  <!-- Turnbuckle Icons -->
  <rect x="180" y="220" width="16" height="26" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>
  <rect x="600" y="220" width="16" height="26" rx="3" fill="#F8FAFC" stroke="#0F172A" stroke-width="2"/>

  <!-- Header Info -->
  <rect x="25" y="25" width="310" height="48" rx="6" fill="#0F172A" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F87171">BREAKBULK SHIPMENT</text>
  <text x="40" y="62" font-family="monospace" font-size="10" fill="#94A3B8">Vessel Hold Stowage & High-Tension Lashings</text>
</svg>
