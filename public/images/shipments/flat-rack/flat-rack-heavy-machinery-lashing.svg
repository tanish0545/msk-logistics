<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cargoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="frPost" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Background Environment -->
  <rect width="800" height="340" fill="url(#skyGrad)"/>
  <rect y="340" width="800" height="160" fill="url(#deckGrad)"/>
  
  <!-- Terminal Grid / Quay Lines -->
  <line x1="0" y1="380" x2="800" y2="380" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="0" y1="430" x2="800" y2="430" stroke="#475569" stroke-width="2"/>

  <!-- Flat Rack Base Bed (Dark Heavy Steel Chassis) -->
  <rect x="90" y="315" width="620" height="35" rx="4" fill="#B91C1C"/>
  <rect x="90" y="345" width="620" height="15" fill="#7F1D1D"/>
  
  <!-- Flat Rack End Collapsible Walls / Posts -->
  <!-- Left Wall -->
  <rect x="80" y="160" width="30" height="160" rx="3" fill="url(#frPost)"/>
  <rect x="75" y="150" width="40" height="15" rx="2" fill="#991B1B"/>
  <circle cx="95" cy="180" r="6" fill="#FEE2E2" stroke="#991B1B" stroke-width="2"/>
  <circle cx="95" cy="280" r="6" fill="#FEE2E2" stroke="#991B1B" stroke-width="2"/>
  
  <!-- Right Wall -->
  <rect x="690" y="160" width="30" height="160" rx="3" fill="url(#frPost)"/>
  <rect x="685" y="150" width="40" height="15" rx="2" fill="#991B1B"/>
  <circle cx="705" cy="180" r="6" fill="#FEE2E2" stroke="#991B1B" stroke-width="2"/>
  <circle cx="705" cy="280" r="6" fill="#FEE2E2" stroke="#991B1B" stroke-width="2"/>

  <!-- Heavy Out-Of-Gauge Industrial Machinery on Skids -->
  <rect x="180" y="140" width="440" height="160" rx="6" fill="url(#cargoGrad)" stroke="#B45309" stroke-width="3"/>
  <rect x="220" y="110" width="200" height="30" rx="4" fill="#D97706"/>
  <rect x="460" y="120" width="120" height="20" rx="3" fill="#B45309"/>
  
  <!-- Mechanical Components & Inspection Hatches -->
  <circle cx="280" cy="210" r="35" fill="#78350F" opacity="0.4"/>
  <circle cx="280" cy="210" r="22" fill="#92400E"/>
  <circle cx="510" cy="210" r="45" fill="#78350F" opacity="0.4"/>
  <circle cx="510" cy="210" r="30" fill="#92400E"/>

  <!-- Timber Chocking & Shoring Bed -->
  <rect x="160" y="300" width="480" height="15" fill="#D97706" stroke="#92400E" stroke-width="1.5"/>
  <rect x="160" y="285" width="35" height="15" fill="#B45309"/>
  <rect x="605" y="285" width="35" height="15" fill="#B45309"/>
  
  <!-- High-Tensile Marine Lashing Straps (Red / High-Visibility Yellow) -->
  <!-- Cross Lashings Left -->
  <line x1="95" y1="315" x2="260" y2="140" stroke="#FBBF24" stroke-width="5" stroke-dasharray="14,2"/>
  <line x1="95" y1="315" x2="340" y2="140" stroke="#EF4444" stroke-width="5"/>
  <!-- Cross Lashings Right -->
  <line x1="705" y1="315" x2="540" y2="140" stroke="#FBBF24" stroke-width="5" stroke-dasharray="14,2"/>
  <line x1="705" y1="315" x2="460" y2="140" stroke="#EF4444" stroke-width="5"/>
  <!-- Central Tie Downs -->
  <line x1="240" y1="315" x2="380" y2="140" stroke="#EF4444" stroke-width="4"/>
  <line x1="560" y1="315" x2="420" y2="140" stroke="#EF4444" stroke-width="4"/>
  
  <!-- Ratchet Load Binders & Turnbuckles -->
  <circle cx="160" cy="245" r="7" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>
  <circle cx="640" cy="245" r="7" fill="#F8FAFC" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Technical Spec Watermark / Label Banner -->
  <rect x="25" y="25" width="310" height="48" rx="6" fill="#0F172A" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F87171">FLAT RACK SHIPMENT</text>
  <text x="40" y="62" font-family="monospace" font-size="10" fill="#94A3B8">OOG Heavy Industrial Machinery Lashing</text>

  <!-- Technical Dimension Overlay -->
  <line x1="90" y1="375" x2="710" y2="375" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="90" y1="370" x2="90" y2="380" stroke="#94A3B8" stroke-width="2"/>
  <line x1="710" y1="370" x2="710" y2="380" stroke="#94A3B8" stroke-width="2"/>
  <text x="360" y="392" font-family="monospace" font-size="11" font-weight="bold" fill="#F8FAFC">40' FLAT RACK (12.19m)</text>
</svg>
