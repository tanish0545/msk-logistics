<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSkid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="skidSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <rect width="800" height="340" fill="url(#bgSkid)"/>
  <rect y="340" width="800" height="160" fill="#1E293B"/>

  <!-- Flat Rack Chassis -->
  <rect x="90" y="315" width="620" height="35" rx="4" fill="#B91C1C"/>
  <rect x="80" y="170" width="30" height="150" rx="3" fill="#991B1B"/>
  <rect x="690" y="170" width="30" height="150" rx="3" fill="#991B1B"/>

  <!-- Heavy Steel Skid Assembly -->
  <rect x="150" y="270" width="500" height="45" rx="4" fill="url(#skidSteel)" stroke="#334155" stroke-width="2"/>
  <rect x="180" y="150" width="130" height="120" rx="4" fill="#3B82F6" stroke="#1D4ED8" stroke-width="2"/>
  <rect x="330" y="130" width="140" height="140" rx="4" fill="#10B981" stroke="#047857" stroke-width="2"/>
  <rect x="490" y="160" width="130" height="110" rx="4" fill="#6366F1" stroke="#4338CA" stroke-width="2"/>

  <!-- Multi-direction Heavy Lashing -->
  <line x1="95" y1="315" x2="245" y2="150" stroke="#FBBF24" stroke-width="5"/>
  <line x1="95" y1="315" x2="380" y2="130" stroke="#EF4444" stroke-width="4"/>
  <line x1="705" y1="315" x2="555" y2="160" stroke="#FBBF24" stroke-width="5"/>
  <line x1="705" y1="315" x2="420" y2="130" stroke="#EF4444" stroke-width="4"/>

  <!-- Header Info -->
  <rect x="25" y="25" width="310" height="48" rx="6" fill="#0F172A" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F87171">FLAT RACK SHIPMENT</text>
  <text x="40" y="62" font-family="monospace" font-size="10" fill="#94A3B8">Modular Industrial Skid Units Lashing</text>
</svg>
