<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="cylGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="340" fill="url(#skyGrad2)"/>
  <rect y="340" width="800" height="160" fill="#1E293B"/>
  
  <line x1="0" y1="390" x2="800" y2="390" stroke="#475569" stroke-width="2" stroke-dasharray="8,8"/>

  <!-- Flat Rack Chassis -->
  <rect x="90" y="315" width="620" height="35" rx="4" fill="#B91C1C"/>
  <rect x="80" y="180" width="30" height="140" rx="3" fill="#991B1B"/>
  <rect x="690" y="180" width="30" height="140" rx="3" fill="#991B1B"/>

  <!-- Cylindrical Industrial Pressure Vessel / Boiler -->
  <rect x="170" y="160" width="460" height="130" rx="65" fill="url(#cylGrad)" stroke="#0369A1" stroke-width="3"/>
  <rect x="220" y="195" width="20" height="60" rx="4" fill="#E0F2FE"/>
  <rect x="560" y="195" width="20" height="60" rx="4" fill="#E0F2FE"/>
  
  <!-- Contoured Timber Cradle Chocking -->
  <path d="M 210,315 L 240,240 L 290,315 Z" fill="#D97706" stroke="#78350F" stroke-width="2"/>
  <path d="M 510,315 L 560,240 L 590,315 Z" fill="#D97706" stroke="#78350F" stroke-width="2"/>

  <!-- High-Tensile Steel Wire Rope & Chain Lashings -->
  <line x1="95" y1="315" x2="280" y2="160" stroke="#FBBF24" stroke-width="5"/>
  <line x1="95" y1="315" x2="360" y2="160" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="5,2"/>
  <line x1="705" y1="315" x2="520" y2="160" stroke="#FBBF24" stroke-width="5"/>
  <line x1="705" y1="315" x2="440" y2="160" stroke="#E2E8F0" stroke-width="4" stroke-dasharray="5,2"/>

  <!-- Tension Binders -->
  <rect x="175" y="225" width="16" height="24" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>
  <rect x="610" y="225" width="16" height="24" rx="3" fill="#F1F5F9" stroke="#0F172A" stroke-width="2"/>

  <!-- Info Overlay -->
  <rect x="25" y="25" width="310" height="48" rx="6" fill="#0F172A" opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="40" y="45" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#F87171">FLAT RACK SHIPMENT</text>
  <text x="40" y="62" font-family="monospace" font-size="10" fill="#94A3B8">Contoured Timber Saddle & Wire Lashings</text>
</svg>
